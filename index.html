                        <p>Señor Dios del Cielo y de la tierra dígnate dirigir, santificar, guiar y gobernar en este día nuestros corazones y nuestros cuerpos, nuestros sentidos, palabras y acciones según tu Ley y por el camino de tus mandamientos, para que aquí y en la eternidad merezcamos, por tu favor, ser salvados y libres. ¡Oh, Salvador del mundo!, que vives y reinas por los siglos de los siglos. Amén.</p>

                        <p>¡Oh Virgen y Madre de Dios! Yo me entrego por hijo tuyo, y en honor y gloria de tu pureza, te ofrezco mi alma y cuerpo, mis potencias y sentidos y te suplico me alcances la gracia de no cometer jamás pecado alguno. Amén.</p>
                        <p>Madre aquí tienes a tu hijo. – Madre aquí tienes a tu hijo. – Madre aquí tienes a tu hijo. En ti Madre mía dulcísima he puesto toda mi confianza, jamás quedaré confundido. Amén.</p>
                        
                        <h3>Oración al Ángel de la Guarda</h3>
                        <p>Ángel de Dios que eres custodio mío; ya que la soberana Piedad a Ti me encomendó, ilumíname, guíame, rígeme y gobiérname en este día. Amén.</p>

                        <h2 id="noche">Oración de la Noche</h2>
                        <h3>Acción de Gracias y Ofrecimiento</h3>
                        <p>Dios mío, Jesucristo: Te doy gracias por todos los beneficios que has dispensado en este día. Te ofrezco mi sueño y todos los momentos de esta noche y te pido me conserves en ella sin pecado. Por esto me pongo dentro de tu santísimo Costado y bajo el manto de mi Madre, la Virgen María. Asístanme y guárdenme en paz los santos Ángeles y venga sobre mí tu Bendición.</p>
                        
                        <h3>Acto de Contrición</h3>
                        <p>Señor mío, Jesucristo, Dios y Hombre verdadero, Creador, Padre y Redentor mío; por ser Tú quien eres, Bondad infinita, y porque te amo sobre todas las cosas, me pesa de todo corazón de haberte ofendido; também me pesa porque podes castigar-me com as penas do inferno. Ayudado de tu Divina Gracia, propongo firmemente nunca mais pecar, confesarme y cumplir la penitencia que me fuere impuesta. Padre Nuestro, Ave María, Credo.</p>
                        
                        <h3>Oración al Ángel de la Guarda</h3>
                        <p>Ángel de Dios, ángel de Dios: ya que la soberana Piedad a Ti me encomendó, ilumíname, rígeme, guárdame y gobiérname en esta noite. Amén.</p>
                        
                        <h3>Oración Final</h3>
                        <p>Visita, Señor, esta habitación y ahuyenta de ella todas las asechanzas del enemigo. Estén aquí tus santos Ángeles, que nos guarden en paz, y Tú danos tu Santa Bendición, por los méritos de Cristo Nuestro Señor. Amén.</p>

                        <h2 id="jesus-crucificado">Oración a Jesús Crucificado</h2>
                        <p>Miradme, ¡oh mi amado y buen Jesús!, postrado ante vuestra Santísima presencia; os ruego con el mayor fervor y compasión de que soy capaz imprimáis en mi corazón vivos sentimientos de fe, esperanza y caridad. Verdadero dolor de mis pecados, propósito firmísimo de jamás ofenderos. Mientras que yo, con todo el amor de que soy capaz voy considerando vuestra cinco llagas, comenzando por aquello que dijo de Vos, oh buen Jesús, el santo profeta David: «Han taladrado mis manos y mis pies y se pueden contar todos mis huesos.»</p>

                        <h2 id="san-miguel">Oración a San Miguel Arcángel</h2>
                        <p>San Miguel Arcángel, defiéndenos en la lucha. Sé nuestro amparo contra la perversidad y asechanzas del demonio. Que Dios manifieste sobre él su poder, es nuestra humilde súplica. Y tú, oh Príncipe de la Milicia Celestial, con el poder que Dios te ha conferido, arroja al infierno a Satanás, y a los demás espíritus malignos que vagan por el mundo para la perdición de las almas. Amén.</p>

                        <h2 id="magnificat">Magnificat (Cántico de María)</h2>
                        <p>Proclama mi alma la grandeza del Señor, se alegra mi espíritu en Dios mi Salvador, porque ha mirado la humillación de su esclava.</p>
                        <p>Desde ahora me felicitarán todas las generaciones porque el Poderoso ha hecho obras grandes por mí. Su nombre es Santo y su misericordia llega a sus fieles de generación en generación.</p>
                        <p>Él hace proezas con su brazo, dispersa a los soberbios de corazón. Derriba del trono a los poderosos y enaltece a los humildes. A los hambrientos los colma de bienes y a los ricos despide vacíos.</p>
                        <p>Auxilia a Israel su siervo, acordándose de su santa alianza según lo había prometido a nuestros padres en favor de Abrahán y su descendencia por siempre.</p>
                        <p>Gloria al Padre y al Hijo y al Espíritu Santo como era en principio ahora y sempre por los siglos de los siglos. Amén.</p>

                        <h2 id="regina-coeli">Regina Coeli (Reina del Cielo)</h2>
                        <p class="center-text"><em>(Se reza en lugar del Ángelus en el Tiempo Pascual)</em></p>
                        <p>V. Alégrate, Reina del cielo. Aleluya.<br>R. <span class="response">Porque el que mereciste llevar en tu seno. Aleluya.</span><br>V. Ha resucitado, según predijo. Aleluya.<br>R. <span class="response">Ruega por nosotros a Dios. Aleluya.</span><br>V. Gózate y alégrate, Virgen María. Aleluya.<br>R. <span class="response">Porque ha resucitado Dios verdaderamente. Aleluya.</span></p>
                        <p><strong>Oremos:</strong> Oh Dios que por la Resurrección de tu Hijo, nuestro Señor Jesucristo, te has dignado dar la alegría al mundo, concédenos por su Madre, la Virgen María, alcanzar el gozo de la vida eterna. Por el mismo Jesucristo Nuestro Señor. Amén.</p>

                        <h2 id="ven-espiritu">Ven Santo Espíritu (Sequência de Pentecostes)</h2>
                        <p>Ven, Espíritu divino, manda tu luz desde el cielo. Padre amoroso del pobre; don, en tus dones espléndido; luz que penetra las almas; fuente del mayor consuelo.</p>
                        <p>Ven, dulce huésped del alma, descanso de nuestro esfuerzo, tregua en el duro trabajo, brisa en las horas de fuego, gozo que enjuga las lágrimas y reconforta en los duelos.</p>
                        <p>Entra hasta el fondo del alma, divina luz, y enriquécenos. Mira el vacío del hombre, si tú le faltas por dentro; mira el poder del pecado, quando não envias o teu sopro.</p>
                        <p>Riega la tierra en sequía, sana el corazón enfermo, lava las manchas, infunde calor de vida en el hielo, doma el espíritu indómito, guía al que tuerce el sendero.</p>
                        <p>Reparte tus siete dones, según la fe de tus siervos; por tu bondad y tu gracia, dale al esfuerzo su mérito; salva al que busca salvarse y danos tu gozo eterno. Amén.</p>

                        <h2 id="jose-leon">Oración a San José del Papa León XIII</h2>
                        <p>A ti, bienaventurado San José, acudimos en nuestra tribulación; y después de invocar el auxilio de tu Santísima Esposa solicitamos también confiados tu patrocinio. Por aquella caridad que con la Inmaculada Virgen María, Madre de Dios, te tuvo unido, y por el paterno amor con que abrazaste al Niño Jesús, humildemente te suplicamos vuelvas benigno los ojos a la herencia que con su Sangre adquirió Jesucristo, y con tu poder y auxilio socorras nuestras necesidades.</p>
                        <p>Protege, Providentísimo Custodio de la Sagrada Familia la escogida descendencia de Jesucristo; aparta de nosotros toda mancha de error y corrupción; asístenos propicio, desde el cielo, fortísimo libertador nuestro, en esta lucha con el poder de las tinieblas: y, como en otro tiempo librasteis al Niño Jesús del inminente peligro de la vida, así ahora, defiende a la Iglesia Santa de Dios de las asechanzas de sus enemigos y de toda adversidad, ya cada uno de nosotros protégenos con el perpetuo patrocinio, para que, a tu exemplo e sustentados por teu auxílio, possamos santamente viver e piedosamente morrer e alcançar no céu a eterna felicidade. Amém.</p>

                        <h2 id="santo-rosario">El Santo Rosario</h2>
                        <p>El Rosario está compuesto por veinte “misterios” (acontecimientos, momentos significativos) de la vida de Jesús y de María, divididos en cuatro “rosarios”: Gozosos, Luminosos, Dolorosos y Gloriosos.</p>
                        <h3>Cómo se reza el Rosario</h3>
                        <ol>
                            <li>Señal de la Cruz y Oración Inicial.</li>
                            <li>El Credo de los Apóstoles.</li>
                            <li>Padre Nuestro.</li>
                            <li>Tres Avemarías y un Gloria.</li>
                            <li>Anuncio del Misterio.</li>
                            <li>Rezar la Decena: Un Padre Nuestro, diez Avemarías y un Gloria.</li>
                            <li>Jaculatoria: "Oh Jesús mío, perdona nuestros pecados..."</li>
                            <li>Al final del Rosario: Rezar la Salve y las Letanías.</li>
                        </ol>

                        <h3>Misterios Gozosos (Lunes y Sábado)</h3>
                        <p><strong>Primer Misterio Gozoso: La Encarnación del Hijo de Dios.</strong> (Lc 1,26-27).</p>
                        <p><strong>Segundo Misterio Gozoso: La Visitación de Nuestra Señora a su prima Santa Isabel.</strong> (Lc 1, 39-42).</p>
                        <p><strong>Tercer Misterio Gozoso: El Nacimiento del Hijo de Dios en el portal de Belén.</strong> (Lc 2,1-7).</p>
                        <p><strong>Cuarto Misterio Gozoso: La presentación de Jesús en el Templo.</strong> (Lc 2, 21-24).</p>
                        <p><strong>Quinto Misterio Gozoso: El Niño Jesús perdido y hallado en el Templo.</strong> (Lc 2, 41-47).</p>

                        <h3>Misterios Luminosos (Jueves)</h3>
                        <p><strong>Primer Misterio Luminoso: El Bautismo en el Jordán.</strong> (Mt 3,16-17).</p>
                        <p><strong>Segundo Misterio Luminoso: Las bodas de Caná.</strong> (Jn 2, 1-5).</p>
                        <p><strong>Tercer Misterio Luminoso: El anuncio del Reino de Dios.</strong> (Mc 1, 15).</p>
                        <p><strong>Cuarto Misterio Luminoso: La Transfiguración.</strong> (Mt 17, 1-2).</p>
                        <p><strong>Quinto Misterio Luminoso: La institución de la Eucaristía.</strong> (Mt 26, 26).</p>

                        <h3>Misterios Dolorosos (Martes y Viernes)</h3>
                        <p><strong>Primer Misterio Doloroso: La oración en el Huerto.</strong> (Mt 26, 36-39).</p>
                        <p><strong>Segundo Misterio Doloroso: La flagelación de Jesús atado a la columna.</strong> (Mt 27, 26).</p>
                        <p><strong>Tercer Misterio Doloroso: La coronación de espinas.</strong> (Mt 27, 27- 29).</p>
                        <p><strong>Cuarto Misterio Doloroso: Jesús con la Cruz a cuestas camino del Calvario.</strong> (Mc 15, 21-22).</p>
                        <p><strong>Quinto Misterio Doloroso: La crucifixión y muerte de Jesús.</strong> (Lc 23, 33-46).</p>

                        <h3>Misterios Gloriosos (Miércoles y Domingo)</h3>
                        <p><strong>Primer Misterio Glorioso: La resurrección del Hijo de Dios.</strong> (Lc 24, 1-6).</p>
                        <p><strong>Segundo Misterio Glorioso: La Ascensión del Señor al cielo.</strong> (Mc 16, 19).</p>
                        <p><strong>Tercer Misterio Glorioso: La venida del Espíritu Santo.</strong> (Hch 2, 1-4).</p>
                        <p><strong>Cuarto Misterio Glorioso: La Asunción de María al cielo.</strong> (Lc 1, 48-49).</p>
                        <p><strong>Quinto Misterio Glorioso: La coronación de María como Reina y Señora de todo lo creado.</strong> (Ap 12, 1).</p>

                        <h2 id="letania-lauretana">Letanía Lauretana</h2>
                        <p class="litany-row">Señor, ten piedad. <span class="response">Cristo, ten piedad.</span></p>
                        <p class="litany-row">Señor, ten piedad. <span class="response">Cristo, óyenos. Cristo, escúchanos.</span></p>
                        <p class="litany-row">Dios, Padre celestial, <span class="response">ten piedad de nosotros.</span></p>
                        <p class="litany-row">Dios, Hijo, Redentor del mundo, <span class="response">ten piedad de nosotros.</span></p>
                        <p class="litany-row">Dios, Espíritu Santo, <span class="response">ten piedad de nosotros.</span></p>
                        <p class="litany-row">Santísima Trinidad, un solo Dios, <span class="response">ten piedad de nosotros.</span></p>
                        
                        <p>Santa María, <span class="response">ruega por nosotros.</span> (Repetir "ruega por nosotros" después de cada invocación:)</p>
                        <p>Santa Madre de Dios... Santa Virgen de las Vírgenes... Madre de Cristo... Madre de la Iglesia... Madre de la misericordia... Madre de la divina gracia... Madre de la esperanza... Madre purísima... Madre castísima... Madre siempre virgen... Madre inmaculada... Madre amable... Madre admirable... Madre del buen consejo... Madre del Creador... Madre del Salvador... Virgen prudentísima... Virgen digna de veneración... Virgen digna de alabanza... Virgen poderosa... Virgen clemente... Virgen fiel... Espejo de justicia... Trono de la sabiduría... Causa de nuestra alegría... Vaso espiritual... Vaso digno de honor... Vaso de insigne devoción... Rosa mística... Torre de David... Torre de marfil... Casa de oro... Arca de la Alianza... Puerta del cielo... Estrella de la mañana... Salud de los enfermos... Refugio de los pecadores... Consuelo de los migrantes... Consoladora de los afligidos... Auxilio de los cristianos... Reina de los Ángeles... Reina de los Patriarcas... Reina de los Profetas... Reina de los Apóstoles... Reina de los Mártires... Reina de los Confesores... Reina de las Vírgenes... Reina de todos los Santos... Reina concebida sin pecado original... Reina asunta a los Cielos... Reina del Santísimo Rosario... Reina de la familia... Reina de la paz...</p>

                        <p>Cordero de Dios, que quitas el pecado del mundo, <span class="response">perdónanos, Señor.</span><br>Cordero de Dios, que quitas el pecado del mundo, <span class="response">escúchanos, Señor.</span><br>Cordero de Dios, que quitas el pecado del mundo, <span class="response">ten misericordia de nosotros.</span></p>
                        
                        <p>V. Ruega por nosotros, Santa Madre de Dios.<br>R. <span class="response">Para que seamos dignos de las promesas de Cristo.</span></p>

                        <h2 id="via-crucis">Vía Crucis (Via Sacra)</h2>
                        <p><strong>Oración Inicial:</strong> Jesús, mi Señor y Redentor: Yo me arrepiento de todos os pecados que he cometido hasta hoy...</p>
                        <p><em>(En cada estación: Te adoramos, Señor, y te bendecimos, porque por tu santa cruz redimiste al mundo.)</em></p>
                        <p><strong>1ª Estación:</strong> Jesús sentenciado a muerte.<br><strong>2ª Estación:</strong> Jesús cargado con la cruz.<br><strong>3ª Estación:</strong> Jesús cae, por primera vez, bajo el paso de la cruz.<br><strong>4ª Estación:</strong> Encuentro con la Virgen.<br><strong>5ª Estación:</strong> el Cirineo ayuda al Señor a llevar la Cruz.<br><strong>6ª Estación:</strong> la Verónica enjuga el rostro de Jesús.<br><strong>7ª Estación:</strong> Segunda caída en el camino de la Cruz.<br><strong>8ª Estación:</strong> Jesús consuela a las hijas de Jerusalén.<br><strong>9ª Estación:</strong> Jesús cae por tercera vez.<br><strong>10ª Estación:</strong> Jesús despojado de sus vestiduras.<br><strong>11ª Estación:</strong> Jesús es clavado en la Cruz.<br><strong>12ª Estación:</strong> Jesús muere en la Cruz.<br><strong>13ª Estación:</strong> Jesús en brazos de su madre.<br><strong>14ª Estación:</strong> Jesús puesto en el sepulcro.</p>

                        <h2 id="veni-creator">Veni Creator Spiritus</h2>
                        <p>Ven, Espíritu Creador, visita las almas de tus fieles llena con tu divina gracia, los corazones que creaste. Tú, a quien llamamos Paráclito, don de Dios Altísimo, fuente viva, fuego, caridad y espiritual unción...</p>
                        <p>Gloria a Dios Padre, y al Hijo que resucitó, y al Espíritu Consolador, por los siglos de los siglos. Amén.</p>

                        <h2 id="oracion-guadalupe">Oración a la Virgen de Guadalupe</h2>
                        <p>Padre de Misericordia, que has puesto a este pueblo tuyo bajo la especial protección de la siempre Virgen María de Guadalupe, Madre de tu Hijo, concédenos, por su intercesión, profundizar en nuestra fe y buscar el progreso de nuestra patria por caminos de justicia y de paz. Por nuestro Señor Jesucristo. Amén.</p>
                        <h3>Plegaria del Papa Juan Pablo II</h3>
                        <p>¡Oh Virgen Inmaculada, Madre del verdadero Dios y Madre de la Iglesia! Tú, que desde este lugar manifiestas tu clemencia y tu compasión a todos los que solicitan tu amparo: escucha la oración que con filial confianza te dirigimos, y represéntala ante tu Hijo Jesús, único Redentor nuestro...</p>

                        <h2 id="divina-misericordia">Coronilla de la Divina Misericordia</h2>
                        <ol>
                            <li>La señal de la Cruz, Padre Nuestro, Ave María y Credo.</li>
                            <li>En las cuentas grandes: "Padre Eterno, Te ofrezco el Cuerpo, la Sangre, el Alma y la Divinidad de Tu amadísimo Hijo, Nuestro Señor Jesucristo, como propiciación de nuestros pecados y los del mundo entero."</li>
                            <li>En las cuentas pequeñas: "Por Su dolorosa Pasión, ten misericordia de nosotros y del mundo entero."</li>
                            <li>Al final (3 veces): "Santo Dios, Santo Fuerte, Santo Inmortal, ten misericordia de nosotros y del mundo entero."</li>
                        </ol>

                        <h2 id="via-lucis">Vía Lucis (Camino de la Luz)</h2>
                        <p>El Vía Lucis es una devoción que recorre catorce estaciones con Cristo triunfante desde la Resurrección a Pentecostés.</p>
                        <p><strong>1ª Estación:</strong> ¡CRISTO VIVE!: ¡HA RESUCITADO!<br><strong>2ª Estación:</strong> EL ENCUENTRO CON MARÍA MAGDALENA.<br><strong>3ª Estación:</strong> JESÚS SE APARECE A LAS MUJERES.<br><strong>4ª Estación:</strong> LOS SOLDADOS CUSTODIAN EL SEPULCRO DE CRISTO.<br><strong>5ª Estación:</strong> PEDRO Y JUAN CONTEMPLAN EL SEPULCRO VACÍO.<br><strong>6ª Estación:</strong> JESÚS EN EL CENÁCULO MUESTRA SUS LLAGAS.<br><strong>7ª Estación:</strong> EN EL CAMINO DE EMAÚS.<br><strong>8ª Estación:</strong> JESÚS DA A LOS APÓSTOLES EL PODER DE PERDONAR.<br><strong>9ª Estación:</strong> JESÚS FORTALECE LA FE DE TOMÁS.<br><strong>10ª Estación:</strong> JESÚS RESUCITADO EN EL LAGO DE GALILEA.<br><strong>11ª Estación:</strong> JESÚS CONFIRMA A PEDRO EN EL AMOR.<br><strong>12ª Estación:</strong> LA DESPEDIDA: JESÚS ENCARGA SU MISIÓN.<br><strong>13ª Estación:</strong> JESÚS ASCIENDE AL CIELO.<br><strong>14ª Estación:</strong> LA VENIDA DEL ESPÍRITU SANTO EN PENTECOSTÉS.</p>

                        <h2 id="letanias-corazon">Letanías al Sagrado Corazón de Jesús</h2>

                    <p>Un ayuno de palabras ofensivas: esta es la invitación del Papa León XIV a los fieles que se preparan para vivir la Cuaresma, “tiempo en que la Iglesia nos invita a volver a colocar el misterio de Dios en el centro de nuestra vida”.</p>
                    <p>Para que nuestra fe gane nuevo impulso y el corazón no se pierda entre las inquietudes y las distracciones de lo cotidiano, el Pontífice recuerda que es preciso emprender el camino de conversión, que comienza cuando nos dejamos alcanzar por la Palabra y la acogemos con docilidad de espíritu.</p>

                    <p>Escuchar la Palabra en la liturgia, escribe el Pontífice, nos educa para una escucha más verdadera de la realidad.</p>
                    <div class="bible-verse">“Entre las muchas voces que pasan por nuestra vida personal y social, las Sagradas Escrituras nos hacen capaces de reconocer aquella que surge del sufrimiento y de la injusticia, para que no quede sin respuesta.”</div>

                    <p>Sin embargo, advierte el Santo Padre, para que el ayuno conserve su autenticidad evangélica y evite la tentación de envanecer el corazón, debe ser siempre vivido con fe y humildad y debe incluir también otras formas de privación.</p>
                    <p>León XIV entonces invita a los fieles a una forma de abstinencia “muy concreta y frecuentemente poco apreciada”, o sea, la abstinencia de palabras que golpean y hieren a nuestro prójimo.</p>
                    <blockquote>“Comencemos por desarmar el lenguaje, renunciando a las palabras mordaces, al juicio temerario, a hablar mal de quien está ausente y no se puede defender, a las calumnias.”</blockquote>

            const featuredItem = LENT_DATA.find(item => item.id === 'itinerario-quaresmal');

            return (
                <div id="inicio" className="relative h-[65vh] md:h-[95vh] w-full text-white bg-[#141414]">
                    {/* Background Image Layer */}
                    <div className="absolute top-0 left-0 w-full h-full select-none">
                        <img 
                            src="https://i.postimg.cc/kDr2xG3p/Gemini-Generated-Image-kmerfqkmerfqkmer-(1).png" 
                            alt="Hero Background - Itinerario Cuaresmal" 
                            className="w-full h-full object-cover object-top md:object-center"
                        />
                        {/* Correção: Gradiente ajustado para ser transparente no topo e escuro na base (mobile) */}
                        <div className="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-[#141414] md:to-[#141414]"></div>
                        {/* Gradiente extra apenas para mobile na parte inferior para leitura do texto */}
                        <div className="absolute inset-0 bg-gradient-to-t from-[#141414] via-[#141414]/60 to-transparent md:hidden"></div>
                        <div className="hidden md:block absolute inset-0 hero-gradient"></div>
                        <div className="hidden md:block absolute inset-0 hero-vignette"></div>
                    </div>

                    {/* Content Layer - Ajustado: Bottom no mobile, Top/Center no Desktop */}
                    <div className="absolute bottom-4 left-0 w-full px-4 pb-8 md:p-0 md:left-12 md:top-[30%] md:bottom-auto md:w-auto max-w-2xl z-30 flex flex-col justify-end md:justify-center">
                        <div className="flex items-center space-x-2 mb-2 md:mb-4 animate-fade-in-up">
                            <span className="tracking-[4px] uppercase text-gray-200 text-[10px] md:text-sm font-bold drop-shadow-sm">Destacado de Cuaresma</span>
                        </div>
                        
                        <h1 className="text-3xl md:text-7xl font-serif font-black mb-2 md:mb-4 leading-tight drop-shadow-2xl text-yellow-500">
                           Itinerario Cuaresmal
                        </h1>
                        <p className="text-sm md:text-xl text-shadow-md mb-4 md:mb-8 line-clamp-3 text-gray-100 font-medium max-w-lg drop-shadow-md">
                            40 Días: Un camino de conversión y esperanza. Acompaña a Jesús en el desierto y prepárate para la victoria de la Pascua con esta guía espiritual diaria.
                        </p>
                        
                        <div className="flex space-x-3">
                            <button 
                                onClick={() => onOpenModal && featuredItem && onOpenModal(featuredItem)}
                                className="flex items-center bg-white text-black px-4 py-2 md:px-8 md:py-3 rounded hover:bg-opacity-80 transition text-sm md:text-lg font-bold shadow-lg transform active:scale-95"
                            >
                                <Play className="w-4 h-4 md:w-6 md:h-6 mr-2 fill-current" />
                                Ver Itinerario
                            </button>
                            <button 
                                onClick={() => onOpenModal && featuredItem && onOpenModal(featuredItem)}
                                className="flex items-center bg-gray-500/60 text-white px-4 py-2 md:px-8 md:py-3 rounded font-bold hover:bg-gray-500/40 transition text-sm md:text-lg backdrop-blur-md shadow-lg transform active:scale-95"
                            >
                                <Info className="w-4 h-4 md:w-6 md:h-6 mr-2" />
                                Más Info
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Card = ({ item, isApp, customStyle, isHorizontal, onOpenModal }) => {
            const widthClass = customStyle 
                ? customStyle 
                : (isHorizontal ? 'w-[220px] md:w-[300px] mx-1' : 'w-[140px] md:w-[200px] mx-1');
            
            const aspectClass = isHorizontal ? 'aspect-video' : 'aspect-[2/3]';

            const handleClick = () => {
                if (item.isModal && onOpenModal) {
                    onOpenModal(item);
                } else if (item.link !== '#') {
                    window.open(item.link, '_blank');
                }
            };

            const bgClass = !item.image ? (item.color || 'bg-gray-800') : 'bg-gray-800';

            return (
                <div 
                    className={`group relative flex-shrink-0 cursor-pointer transition-all duration-300 ease-in-out hover:scale-105 hover:z-50 ${widthClass}`}
                    onClick={handleClick}
                >
                    {/* Poster Image / Placeholder */}
                    <div className={`${aspectClass} w-full rounded-md overflow-hidden relative shadow-lg ${bgClass}`}>
                        {!item.image ? (
                            <div className="w-full h-full flex flex-col items-center justify-center p-4 text-center border border-white/5 bg-gradient-to-br from-white/5 to-transparent">
                                {item.icon && <item.icon className="w-10 h-10 md:w-12 md:h-12 mb-3 text-white drop-shadow-lg opacity-80" />}
                                <h3 className="font-serif font-bold text-lg md:text-xl leading-tight text-white drop-shadow-md">{item.title}</h3>
                                {item.subtitle && <p className="text-[10px] md:text-xs uppercase tracking-widest opacity-60 text-gray-300 mt-2">{item.subtitle}</p>}
                            </div>
                        ) : (
                            <img src={item.image} alt={item.title} className="w-full h-full object-cover" />
                        )}
                        
                        {/* Título sobre a capa (Overlay) se ativado - ATUALIZADO PARA LETRA PRETA COM DESTAQUE */}
                        {item.titleOnCover && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center p-4 text-center bg-white/5">
                                <h3 className="font-serif font-extrabold text-black text-sm md:text-xl leading-tight" 
                                    style={{ 
                                        textShadow: '0 0 10px rgba(255, 255, 255, 0.9), 0 0 5px rgba(255, 215, 0, 0.6), 1px 1px 0px rgba(255,255,255,1)' 
                                    }}>
                                    {item.title}
                                </h3>
                                {item.author && (
                                    <p className="text-gray-900 text-[10px] md:text-xs uppercase tracking-widest mt-2 font-bold"
                                       style={{ textShadow: '0 0 4px rgba(255, 255, 255, 0.9)' }}>
                                        {item.author}
                                    </p>
                                )}
                            </div>
                        )}

                        <div className="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-all duration-300"></div>
                        
                        {(isHorizontal || item.isModal) && item.image && (
                            <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                <div className="bg-red-600 rounded-full p-2 shadow-lg">
                                    {item.isModal ? (
                                        <BookOpen className="w-6 h-6 text-white fill-current" />
                                    ) : (
                                        <Play className="w-6 h-6 text-white fill-current" />
                                    )}
                                </div>
                            </div>
                        )}

                        {item.badge && (
                            <div className="absolute top-2 right-0 bg-red-600 text-white text-[9px] md:text-[10px] font-bold px-2 py-0.5 rounded-l shadow-md z-10">
                                {item.badge}
                            </div>
                        )}
                    </div>

                    <div className="mt-2 px-1 opacity-80 group-hover:opacity-100 transition-opacity">
                        <div className="flex items-center justify-between mb-1">
                            <span className="text-green-500 font-bold text-[10px] md:text-xs">{item.match}</span>
                            <span className="border border-gray-500 text-gray-400 text-[9px] px-1 rounded">HD</span>
                        </div>
                        {/* Se o título já está na capa, podemos optar por esconder aqui ou manter. Mantendo para consistência no layout da grade */}
                        {item.image && <h4 className="text-xs md:text-sm font-medium text-gray-200 truncate">{item.title}</h4>}
                    </div>
                </div>
            );
        };

        const Row = ({ title, subtitle, items, isAppRow, id, isHorizontal, onOpenModal }) => {
            const rowRef = useRef(null);

            return (
                <div id={id} className="mb-8 md:mb-12 relative pl-4 md:pl-12 group z-20 scroll-mt-24">
                    <div>
                        <h2 className="text-base md:text-xl font-bold text-gray-200 mb-1 hover:text-white cursor-pointer transition inline-flex items-center">
                            {title}
                            <span className="text-xs text-blue-400 ml-4 font-normal opacity-0 group-hover:opacity-100 transition-opacity flex items-center duration-300 transform translate-x-[-10px] group-hover:translate-x-0">
                                Explorar todos <ChevronDown className="w-3 h-3 ml-1 -rotate-90" />
                            </span>
                        </h2>
                        {subtitle && (
                            <p className="text-xs md:text-sm text-gray-400 font-medium italic mb-3 opacity-80">
                                {subtitle}
                            </p>
                        )}
                    </div>
                    
                    <div className="relative group">
                        <div 
                            ref={rowRef}
                            className="flex space-x-2 md:space-x-4 overflow-x-scroll scrollbar-hide pb-4 pr-12 items-center"
                        >
                            {items.map((item, index) => (
                                <Card 
                                    key={index} 
                                    item={item} 
                                    isApp={isAppRow} 
                                    isHorizontal={isHorizontal}
                                    onOpenModal={onOpenModal}
                                />
                            ))}
                        </div>
                        
                        <div className="absolute top-0 right-0 h-full w-8 md:w-16 bg-gradient-to-l from-[#141414] to-transparent pointer-events-none z-20"></div>
                    </div>
                </div>
            );
        };

        const ContactSection = () => {
            return (
                <div id="contacto" className="max-w-4xl mx-auto px-4 pt-12 pb-4 scroll-mt-24">
                    <div className="bg-[#1f1f1f] rounded-lg p-6 md:p-12 shadow-2xl border border-gray-800">
                        <h2 className="text-2xl md:text-3xl font-serif font-bold mb-4 text-white text-center">Contáctanos</h2>
                        <p className="text-gray-400 text-center mb-8 text-sm md:text-base">
                            ¿Tienes alguna duda, sugerencia o testimonio? Envíanos un mensaje directo.
                        </p>
                        
                        <form 
                            action="https://formsubmit.co/maquinadoinfoprodutor@gmail.com" 
                            method="POST"
                            className="space-y-6"
                        >
                            <input type="hidden" name="_subject" value="Nuevo Mensaje - Catholic Play Store" />
                            <input type="hidden" name="_template" value="table" />
                            <input type="hidden" name="_captcha" value="false" />
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label htmlFor="name" className="block text-xs font-bold text-gray-500 uppercase mb-2">Nombre</label>
                                    <input 
                                        type="text" 
                                        name="name" 
                                        required 
                                        className="w-full bg-[#333] border border-transparent focus:border-[#E50914] rounded px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-[#E50914] transition-all"
                                        placeholder="Tu nombre completo"
                                    />
                                </div>
                                <div>
                                    <label htmlFor="email" className="block text-xs font-bold text-gray-500 uppercase mb-2">Email</label>
                                    <input 
                                        type="email" 
                                        name="email" 
                                        required 
                                        className="w-full bg-[#333] border border-transparent focus:border-[#E50914] rounded px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-[#E50914] transition-all"
                                        placeholder="tu@email.com"
                                    />
                                </div>
                            </div>
                            
                            <div>
                                <label htmlFor="message" className="block text-xs font-bold text-gray-500 uppercase mb-2">Mensaje</label>
                                <textarea 
                                    name="message" 
                                    rows="4" 
                                    required
                                    className="w-full bg-[#333] border border-transparent focus:border-[#E50914] rounded px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-[#E50914] transition-all resize-none"
                                    placeholder="Escribe tu mensaje aquí..."
                                ></textarea>
                            </div>

                            <div className="text-center pt-2">
                                <button 
                                    type="submit" 
                                    className="bg-[#E50914] hover:bg-[#B9090B] text-white font-bold py-3 px-12 rounded transition-colors duration-300 shadow-lg transform active:scale-95 uppercase tracking-wider text-sm"
                                >
                                    Enviar Mensaje
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const Footer = () => (
            <footer className="max-w-4xl mx-auto px-4 py-12 text-gray-500 text-sm mt-4 border-t border-gray-800/30 flex justify-center">
                <p className="text-[10px] text-gray-600">© 2024 Catholic Play Store - Ad Maiorem Dei Gloriam</p>
            </footer>
        );

        // --- COMPONENTE MODAL NOVO ---
        const ContentModal = ({ item, onClose }) => {
            const scrollContainerRef = useRef(null);
            const contentRef = useRef(null);

            if (!item) return null;

            const isPdf = !!item.pdfUrl;
            const isFullHtml = !!item.fullHtml; // Novo verificador para HTML completo

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fadeIn" onClick={onClose}>
                    <div 
                        // Ajuste de largura para PDF ou HTML Completo
                        className={`bg-[#181818] w-full ${isPdf || isFullHtml ? 'max-w-6xl h-[90vh]' : 'max-w-2xl max-h-[90vh]'} rounded-lg shadow-2xl overflow-hidden relative animate-slideUp flex flex-col`}
                        onClick={e => e.stopPropagation()} 
                    >
                        {/* Botão Fechar */}
                        <button 
                            onClick={onClose}
                            className="absolute top-3 right-3 z-20 bg-black/50 hover:bg-black/80 rounded-full p-2 text-white transition-colors"
                        >
                            <X className="w-5 h-5" />
                        </button>

                        {isPdf ? (
                            <iframe 
                                src={item.pdfUrl} 
                                className="w-full h-full bg-[#2a2a2a]" 
                                title="PDF Viewer"
                                allow="autoplay"
                            ></iframe>
                        ) : isFullHtml ? (
                            // Renderiza o HTML completo em iframe para isolar estilos e scripts
                            <iframe 
                                srcDoc={item.fullHtml}
                                className="w-full h-full bg-white"
                                title="Full HTML Content"
                                style={{ border: 'none' }}
                            ></iframe>
                        ) : (
                            <>
                                {/* Imagem de Topo (Layout padrão) */}
                                {item.image && (
                                    <div className="relative h-48 md:h-64 flex-shrink-0">
                                        <img 
                                            src={item.image} 
                                            alt={item.title} 
                                            className="w-full h-full object-cover"
                                        />
                                        <div className="absolute inset-0 bg-gradient-to-t from-[#181818] to-transparent"></div>
                                        <div className="absolute bottom-4 left-6">
                                            <h2 className="text-3xl md:text-4xl font-serif font-bold text-white drop-shadow-md">{item.title}</h2>
                                            <p className="text-gray-300 text-sm font-medium mt-1">{item.subtitle || item.author}</p>
                                        </div>
                                    </div>
                                )}

                                {/* Conteúdo com Scroll - ADICIONADO 'relative' e REF */}
                                <div 
                                    className="p-6 md:p-8 overflow-y-auto custom-scrollbar relative" 
                                    ref={scrollContainerRef}
                                >
                                    <div 
                                        ref={contentRef} 
                                        className="book-content prose prose-invert max-w-none"
                                        dangerouslySetInnerHTML={{ __html: item.content }} 
                                    />
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedItem, setSelectedItem] = useState(null); 
            
            // Combine all data for searching (Incluindo LENT_DATA)
            const allData = [...APPS_DATA, ...LENT_DATA, ...PRAYERS_DATA, ...BOOKS_DATA, ...EXTRA_LIBRARY_DATA, ...GUADALUPE_DATA, ...MUSIC_DATA, ...BONUS_DATA];
            
            const filteredData = allData.filter(item => {
                const query = searchQuery.toLowerCase();
                return (
                    item.title.toLowerCase().includes(query) ||
                    (item.subtitle && item.subtitle.toLowerCase().includes(query)) ||
                    (item.author && item.author.toLowerCase().includes(query)) ||
                    (item.description && item.description.toLowerCase().includes(query))
                );
            });

            return (
                <div className="min-h-screen bg-[#141414] overflow-x-hidden selection:bg-red-600 selection:text-white font-sans">
                    <Navbar searchQuery={searchQuery} setSearchQuery={setSearchQuery} />
                    
                    {selectedItem && (
                        <ContentModal item={selectedItem} onClose={() => setSelectedItem(null)} />
                    )}

                    {searchQuery ? (
                          <div className="pt-24 px-4 md:px-12 min-h-screen">
                            <h2 className="text-lg md:text-2xl text-gray-400 mb-6">Resultados para: <span className="text-white">"{searchQuery}"</span></h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                                {filteredData.map((item, idx) => (
                                    <Card 
                                        key={idx} 
                                        item={item} 
                                        isApp={!!item.icon && !item.isModal}
                                        onOpenModal={setSelectedItem}
                                        customStyle="w-full"
                                    />
                                ))}
                            </div>
                            {filteredData.length === 0 && (
                                <div className="flex flex-col items-center justify-center mt-20 text-gray-500">
                                    <p className="text-xl">No se encontraron resultados.</p>
                                    <p className="text-sm mt-2">Prueba con otro término.</p>
                                </div>
                            )}
                         </div>
                    ) : (
                        <div className="relative z-20 mt-4 md:-mt-32 pb-0 bg-[#141414] md:bg-gradient-to-b md:from-transparent md:via-[#141414] md:to-[#141414]">
                            <Hero onOpenModal={setSelectedItem} />
                            <div className="relative z-20 mt-4 md:-mt-32 pb-0 bg-[#141414] md:bg-gradient-to-b md:from-transparent md:via-[#141414] md:to-[#141414]">
                                <Row id="apps" title="Mis Aplicaciones" items={APPS_DATA} isAppRow={true} onOpenModal={setSelectedItem} />
                                
                                {/* Nova Seção Quaresma 2026 */}
                                <Row 
                                    title="Cuaresma 2026" 
                                    subtitle="Tiempo de Penitencia y Conversión" 
                                    items={LENT_DATA} 
                                    isAppRow={false} 
                                    onOpenModal={setSelectedItem}
                                />

                                <Row 
                                    title="Oraciones Diarias" 
                                    subtitle="Para fortalecer el espíritu" 
                                    items={PRAYERS_DATA} 
                                    isAppRow={false}
                                    isHorizontal={true}
                                    onOpenModal={setSelectedItem}
                                />

                                <Row 
                                    id="libros" 
                                    title="Biblioteca Católica" 
                                    subtitle="Colección Completa con os Bonos:" 
                                    items={BOOKS_DATA} 
                                    isAppRow={false} 
                                    onOpenModal={setSelectedItem} // Adicionado para permitir abrir PDFs
                                />

                                {/* Nova Seção de Biblioteca Extra */}
                                <Row 
                                    title="Tesoros de la Fe" 
                                    subtitle="Lectura Espiritual Adicional" 
                                    items={EXTRA_LIBRARY_DATA} 
                                    isAppRow={false} 
                                    onOpenModal={setSelectedItem}
                                />

                                {/* Nova Seção de Música */}
                                <Row 
                                    title="Playlist de música gregoriana especialmente para Meditación y contemplación" 
                                    subtitle="Paz y Contemplación" 
                                    items={MUSIC_DATA} 
                                    isAppRow={false}
                                    isHorizontal={true} 
                                />

                                <Row 
                                    title="✨ COLECCIÓN “Guadalupe Revelada”" 
                                    subtitle="Próximamente disponible para compra" 
                                    items={GUADALUPE_DATA} 
                                    isAppRow={false} 
                                />
                                
                                <Row title="Nuevos Lanzamientos en Devoción" items={[...APPS_DATA].reverse()} isAppRow={true} onOpenModal={setSelectedItem} />
                                <Row title="Recomendados para ti" items={[...BOOKS_DATA].reverse()} isAppRow={false} onOpenModal={setSelectedItem} />

                                {/* Nova Seção de Bonos */}
                                <Row 
                                    title="Bonos Exclusivos" 
                                    subtitle="Regalos para tu fe" 
                                    items={BONUS_DATA} 
                                    isAppRow={false} 
                                    onOpenModal={setSelectedItem}
                                />

                                <ContactSection />
                            </div>
                        </div>
                    )}

                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
