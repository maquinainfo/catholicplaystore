            <h1>Miércoles de Ceniza 2026</h1>
            <img src="https://i.postimg.cc/kGnSSGrv/image.png" alt="Miércoles de Ceniza">
            
            <p class="drop-cap">"Tu Padre, que ve en lo secreto, te recompensará" (Mt 6, 4. 6. 18). Estas palabras de Jesús se dirigen a cada uno de nosotros al inicio del itinerario cuaresmal. Lo comenzamos con la imposición de la ceniza, austero gesto penitencial, muy arraigado en la tradición cristiana. Este gesto subraya la conciencia del hombre pecador ante la majestad y la santidad de Dios. Al mismo tiempo, manifiesta su disposición a acoger y traducir en decisiones concretas la adhesión al Evangelio.</p>
            
            <p>Son muy elocuentes las fórmulas que lo acompañan. La primera, tomada del libro del Génesis: "Acuérdate de que eres polvo y al polvo volverás" (cf. Gn 3, 19), evoca la actual condición humana marcada por la caducidad y el límite. La segunda recoge las palabras evangélicas: "Convertíos y creed el Evangelio" (Mc 1, 15), que constituyen una apremiante exhortación a cambiar de vida. Ambas fórmulas nos invitan a entrar en la Cuaresma con una actitud de escucha y de sincera conversión.</p>

            <h2>2. En lo secreto</h2>
            <p>El Evangelio subraya que el Señor "ve en lo secreto", es decir, escruta el corazón. Los gestos externos de penitencia tienen valor si son expresión de una actitud interior, si manifiestan la firme voluntad de apartarse del mal e iniciar el camino del bien. Aquí radica el sentido profundo de la ascesis cristiana.</p>
            
            <p><strong>"Ascesis"</strong>: la palabra misma evoca la imagen de una ascensión a metas elevadas. Eso implica necesariamente sacrificios y renuncias. En efecto, hace falta reducir el equipaje a lo esencial para que el viaje no sea pesado; estar dispuestos a afrontar todas las dificultades y superar todos los obstáculos para alcanzar el objetivo fijado. Para llegar a ser auténticos discípulos de Cristo, es necesario renunciar a sí mismos, tomar la propia cruz y seguirlo (cf. Lc 9, 23). Es el arduo sendero de la santidad, que todo bautizado está llamado a recorrer.</p>

        <!DOCTYPE html>

                body { font-family: 'Crimson Text', serif; padding: 40px; background: #fcfaf2; line-height: 1.8; color: #333; }

            <p class="drop-cap">Queridos hermanos y hermanas:</p>
            <p>La Cuaresma es el tiempo en el que la Iglesia, con solicitud maternal, nos invita a poner de nuevo el misterio de Dios en el centro de nuestra vida, para que nuestra fe recobre su impulso y el corazón no se disperse entre las inquietudes y distracciones cotidianas.</p>
            <p>Todo caminho de conversión comienza cuando nos dejamos alcanzar por la Palabra y la acogemos con docilidad de espíritu. Existe, por tanto, un vínculo entre el don de la Palabra de Dios, el espacio de hospitalidad que le ofrecemos y la transformación que ella realiza. Por eso, el itinerario cuaresmal se convierte en una ocasión propicia para escuchar la voz del Señor y renovar la decisión de seguir a Cristo, recorriendo con Él el camino que sube a Jerusalén, donde se cumple el misterio de su pasión, muerte y resurrección.</p>

            <h2>Escuchar</h2>
            <p>Este año me gustaría llamar la atención, en primer lugar, sobre la importancia de dar espacio a la Palabra a través de la <strong>escucha</strong>, ya que la disposición a escuchar es el primer signo con el que se manifiesta el deseo de entrar en relación con el otro.</p>
            <p>Dios mismo, al revelarse a Moisés desde la zarza ardiente, muestra que la escucha es un rasgo distintivo de su ser: «Yo he visto la opresión de mi pueblo, que está en Egipto, y he oído los gritos de dolor» (Ex 3,7). La escucha del clamor de los oprimidos es el comienzo de una historia de liberación, en la que el Señor involucra también a Moisés, enviándolo a abrir un camino de salvación para sus hijos reducidos a la esclavitud.</p>
            <p>Es un Dios que nos atrae, que hoy también nos conmueve con los pensamientos que hacen vibrar su corazón. Por eso, la escucha de la Palabra en la liturgia nos educa para una escucha más verdadera de la realidad.</p>
            <p>Entre las many voces que atraviesan nuestra vida personal y social, las Sagradas Escrituras nos hacen capaces de reconocer la voz que clama desde el sufrimiento y la injusticia, para que no quede sin respuesta. Entrar en esta disposición interior de receptividad significa dejarnos instruir hoy por Dios para escuchar <strong>como</strong> Él, hasta reconocer que «la condición de los pobres representa un grito que, en la historia de la humanidad, interpela constantemente nuestra vida, nuestras sociedades, los sistemas políticos y económicos, y especialmente a la Iglesia». [1]</p>

            <h2>Ayunar</h2>
            <p>Si la Cuaresma es tiempo de escucha, el <strong>ayuno</strong> constituye una práctica concreta que dispone a la acogida de la Palabra de Dios. La abstinencia de alimento, en efecto, es un ejercicio ascético antiquísimo e insustituible en el camino de la conversión. Precisamente porque implica al cuerpo, hace más evidente aquello de lo que tenemos “hambre” y lo que consideramos esencial para nuestro sustento. Sirve, por tanto, para discernir y ordenar los “apetitos”, para mantener despierta el hambre y la sed de justicia, sustrayéndola de la resignación, educarla para que se convierta en oración y responsabilidad hacia el prójimo.</p>
            <p>San Agustín, con sutileza espiritual, deja entrever la tensión entre el tiempo presente y la realización futura que atraviesa este cuidado del corazón, cuando observa que: «es propio de los hombres mortales tener hambre y sed de la justicia, así como estar repletos de la justicia es propio de la otra vida. De este pan, de este alimento, están repletos los ángeles; en cambio, los hombres, mientras tienen hambre, se ensanchan; mientras se ensanchan, son dilatados; mientras son dilatados, se hacen capaces; y, hechos capaces, en su momento serán repletos». [2] El ayuno, entendido en este sentido, nos permite no sólo disciplinar el deseo, purificarlo y hacerlo más libre, sino también expandirlo, de modo que se dirija a Dios y se oriente hacia el bien.</p>
            <p>Sin embargo, para que el ayuno conserve su verdad evangélica y evite la tentación de enorgullecer el corazón, debe vivirse siempre con fe y humildad. Exige permanecer arraigado en la comunión con el Señor, porque «no ayuna de verdad quien no sabe alimentarse de la Palabra de Dios». [3] En cuanto signo visible de nuestro compromiso interior de alejarnos, con la ayuda de la gracia, del pecado y del mal, el ayuno debe incluir también otras formas de privación destinadas a hacernos adquirir un estilo de vida más sobrio, ya que « sólo la austeridad hace fuerte y auténtica la vida cristiana». [4]</p>
            <p>Por eso, me gustaría invitarles a una forma de abstinencia muy concreta y a menudo poco apreciada, es decir, la de <strong>abstenerse de utilizar palabras que afectan y lastiman a nuestro prójimo</strong>. Empecemos a desarmar el lenguaje, renunciando a las palabras hirientes, al juicio inmediato, a hablar mal de quienes están ausentes y no pueden defenderse, a las calumnias. Esforcémonos, en cambio, por aprender a medir las palabras y a cultivar la amabilidad: en la familia, entre amigos, en el lugar de trabalho, en las redes sociales, en los debates políticos, en los medios de comunicación e en las comunidades cristianas. Entonces, muchas palabras de odio darán paso a palabras de esperanza y paz.</p>
            
            <div class="ornament">†</div>

            <h2>Juntos</h2>
            <p>Por último, la Cuaresma pone de relieve la dimensión comunitaria de la escucha de la Palabra y de la práctica del ayuno. También la Escritura subraya este aspecto de muchas maneras. Por ejemplo, cuando narra en el libro de Nehemías que el pueblo se reunió para escuchar la lectura pública del libro de la Ley y, practicando el ayuno, se dispuso a la confesión de fe y a la adoración, con el fin de renovar la alianza con Dios (cf. Ne 9,1-3).</p>
            <p>Del mismo modo, nuestras parroquias, familias, grupos eclesiales y comunidades religiosas están llamados a realizar en Cuaresma un camino compartido, en el que la escucha de la Palabra de Dios, así como del clamor de los pobres y de la tierra, se convierta en forma de vida común, y el ayuno sostenga un arrepentimiento real. En este horizonte, la conversión no sólo concierne a la conciencia del individuo, sino también al estilo de las relaciones, a la calidad del diálogo, a la capacidad de dejarse interpelar por la realidad y de reconocer lo que realmente orienta el deseo, tanto en nuestras comunidades eclesiales como en la humanidad sedienta de justicia y reconciliación.</p>
            <p>Queridos hermanos, pidamos la gracia de vivir una Cuaresma que haga más atento nuestro oído a Dios y a los más necesitados. Pidamos la fuerza de un ayuno que alcance también a la lengua, para que disminuyan las palabras que hieren y crezca el espacio para la voz de los demás. Y comprometámonos para que nuestras comunidades se conviertan en lugares donde el grito de los que sufren encuentre acogida y la escucha genere caminos de liberación, haciéndonos más dispuestos y diligentes para contribuir a edificar la civilización del amor.</p>
            <p>Los bendigo de corazón a todos ustedes, y a su camino cuaresmal.</p>

                        <div className="hidden md:block absolute inset-0 hero-gradient"></div>
                    </div>

                    <div className="absolute bottom-4 left-0 w-full px-4 pb-8 md:p-0 md:left-12 md:top-[35%] md:w-auto max-w-2xl z-30">
                        <span className="tracking-[4px] uppercase text-gray-200 text-[10px] md:text-sm font-bold drop-shadow-sm">Destacado de Cuaresma</span>
                        <h1 className="text-3xl md:text-7xl font-serif font-black mb-2 leading-tight text-yellow-500 drop-shadow-lg">Itinerario Cuaresmal</h1>
                        <p className="text-sm md:text-xl mb-4 md:mb-8 text-gray-100 font-medium drop-shadow-md">40 Días: Un camino de conversión e esperanza. Acompaña a Jesús en el desierto e prepárate para la Pascua.</p>
                        <div className="flex flex-col space-y-3 mt-4 w-full md:w-fit">
                            <a href="https://pay.hotmart.com/R104315521P?off=bsjlu74b&checkoutMode=10" target="_blank" className="flex items-center justify-center bg-gradient-to-r from-green-600 to-green-500 text-black px-4 py-3 md:px-8 md:py-4 rounded font-extrabold hover:from-green-500 hover:to-green-400 transition transform hover:scale-105 shadow-lg shadow-green-500/30 w-full no-underline uppercase tracking-wide text-xs md:text-sm">
                                <Crown className="w-5 h-5 mr-2 flex-shrink-0" />
                                <span>Quiero comenzar el itinerario hoy</span>
                            </a>
                            <button onClick={onOpenForm} className="flex items-center justify-center bg-purple-900 text-white border border-purple-700 px-4 py-3 md:px-8 md:py-4 rounded font-bold hover:bg-purple-800 transition transform hover:scale-105 shadow-lg w-full uppercase tracking-wide text-xs md:text-sm">
                                <Play className="w-5 h-5 mr-2 fill-current flex-shrink-0" />
                                <span>Ya adquirí el itinerario, puedo comenzar</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Card = ({ item, onOpenModal, isHorizontal }) => {
            const handleClick = () => {
                if (item.isModal) onOpenModal(item);
                else if (item.link && item.link !== '#') window.open(item.link, '_blank');
            };
            const aspect = isHorizontal ? 'aspect-video' : 'aspect-[2/3]';
            const width = isHorizontal ? 'w-[220px] md:w-[300px]' : 'w-[140px] md:w-[200px]';
            const bgClass = !item.image ? (item.color || 'bg-gray-800') : 'bg-gray-800';

            return (
                <div className={`group relative flex-shrink-0 cursor-pointer transition duration-300 hover:scale-105 hover:z-50 ${width} mx-1`} onClick={handleClick}>
                    <div className={`${aspect} w-full rounded-md overflow-hidden relative shadow-lg ${bgClass}`}>
                        {item.image ? <img src={item.image} alt={item.title} className="w-full h-full object-cover" /> : 
                        <div className="w-full h-full flex flex-col items-center justify-center p-4 text-center">
                            {item.icon ? <item.icon className="w-10 h-10 text-white opacity-80" /> : <BookOpen className="w-8 h-8 text-white opacity-30" />}
                            <h3 className="font-serif font-bold text-white mt-2 text-xs">{item.title}</h3>
                        </div>}
                        {item.titleOnCover && <div className="absolute inset-0 flex items-center justify-center p-4 bg-black/20"><h3 className="font-serif font-bold text-black text-center text-sm md:text-lg" style={{textShadow: '0 0 10px white'}}>{item.title}</h3></div>}
                        {item.badge && <div className="absolute top-2 right-0 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-l shadow-md">{item.badge}</div>}
                    </div>
                    <div className="mt-2 px-1">
                        <div className="flex items-center justify-between mb-1">
                            <span className="text-green-500 font-bold text-[10px]">{item.match}</span>
                            <span className="border border-gray-500 text-gray-400 text-[9px] px-1 rounded">HD</span>
                        </div>
                        <h4 className="text-xs md:text-sm font-medium text-gray-200 truncate">{item.title}</h4>
                    </div>
                </div>
            );
        };

        const Row = ({ title, subtitle, items, onOpenModal, id, isHorizontal }) => (
            <div id={id} className="mb-8 md:mb-12 pl-4 md:pl-12 relative z-20 scroll-mt-24">
                <h2 className="text-base md:text-xl font-bold text-gray-200 mb-1">{title}</h2>
                {subtitle && <p className="text-xs text-gray-400 italic mb-3">{subtitle}</p>}
                <div className="flex space-x-2 md:space-x-4 overflow-x-scroll scrollbar-hide pb-4 pr-12">
                    {items.map((item, idx) => <Card key={idx} item={item} onOpenModal={onOpenModal} isHorizontal={isHorizontal} />)}
                </div>
            </div>
        );

        const ContentModal = ({ item, onClose }) => {
            if (!item) return null;
            const isPdf = !!item.pdfUrl;
            const isFullHtml = !!item.fullHtml;

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fadeIn" onClick={onClose}>
                    <div className={`bg-[#181818] w-full ${isPdf || isFullHtml ? 'max-w-6xl h-[90vh]' : 'max-w-2xl max-h-[90vh]'} rounded-lg shadow-2xl overflow-hidden relative animate-slideUp flex flex-col`} onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-3 right-3 z-20 bg-black/50 hover:bg-black/80 rounded-full p-2 text-white transition-all"><X className="w-5 h-5" /></button>
                        
                        {isPdf ? (
                            <iframe src={item.pdfUrl} className="w-full h-full border-none bg-white" title="PDF"></iframe>
                        ) : isFullHtml ? (
                            <iframe srcDoc={item.fullHtml} className="w-full h-full bg-white border-none" title="HTML"></iframe>
                        ) : (
                            <div className="overflow-y-auto custom-scrollbar h-full">
                                {item.image && (
                                    <div className="relative h-48 md:h-64 flex-shrink-0">
                                        <img src={item.image} className="w-full h-full object-cover" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-[#181818] to-transparent"></div>
                                        <div className="absolute bottom-4 left-6">
                                            <h2 className="text-2xl md:text-4xl font-serif font-bold text-white">{item.title}</h2>
                                        </div>
                                    </div>
                                )}
                                <div className="p-6 md:p-8 book-content prose prose-invert max-w-none" dangerouslySetInnerHTML={{ __html: item.content }} />
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);
            const [showAccessForm, setShowAccessForm] = useState(false);
            
            useEffect(() => {
                const handleOpenForm = () => {
                    setSelectedItem(null); // Fecha o modal atual para a tela ficar limpa
                    setShowAccessForm(true); // Abre o formulário de acesso
                };
                document.addEventListener('open-access-form', handleOpenForm);
                return () => document.removeEventListener('open-access-form', handleOpenForm);
            }, []);

            return (
                <div className="min-h-screen bg-[#141414] overflow-x-hidden font-sans">
                    <Navbar searchQuery={searchQuery} setSearchQuery={setSearchQuery} />
                    {selectedItem && <ContentModal item={selectedItem} onClose={() => setSelectedItem(null)} />}
                    {showAccessForm && <AccessForm isModal={true} onClose={() => setShowAccessForm(false)} />}
                    
                    <div className="relative z-10">
                        <Hero onOpenModal={setSelectedItem} onOpenForm={() => setShowAccessForm(true)} />
                        
                        <div className="relative z-20 md:-mt-32 pb-10">
                            <Row id="apps" title="Mis Aplicaciones" items={APPS_DATA} onOpenModal={setSelectedItem} />
                            <Row title="Cuaresma 2026" subtitle="Tiempo de Penitencia y Conversión" items={LENT_DATA} onOpenModal={setSelectedItem} />
                            <Row title="Oraciones Diarias" items={PRAYERS_DATA} onOpenModal={setSelectedItem} isHorizontal={true} />
                            <Row id="libros" title="Biblioteca Católica" items={BOOKS_DATA} onOpenModal={setSelectedItem} />
                            <Row title="Tesoros de la Fe" subtitle="Lectura Espiritual Adicional" items={EXTRA_LIBRARY_DATA} onOpenModal={setSelectedItem} />
                            <Row title="Playlist Gregoriana" items={MUSIC_DATA} onOpenModal={setSelectedItem} isHorizontal={true} />
                            <Row title="Guadalupe Revelada" items={GUADALUPE_DATA} onOpenModal={setSelectedItem} />
                            <Row title="Bonos Exclusivos" items={BONUS_DATA} onOpenModal={setSelectedItem} />
                            
                            {/* Formulário Clássico de Suporte/Contacto no Final da Página Restaurado */}
                            <ContactForm />
                        </div>
                    </div>
                    
                    <footer className="py-12 text-center text-gray-600 text-[10px] uppercase tracking-widest border-t border-white/5">
                        © 2026 Catholic Play Store - Ad Maiorem Dei Gloriam
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
