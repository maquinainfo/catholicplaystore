<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerario Cuaresmal 2026</title>
    
    <!-- Bibliotecas via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');
        
        .font-sacred { font-family: 'Playfair Display', serif; }
        .font-vatican { font-family: 'Cinzel', serif; }
        .font-reading { font-family: 'Lato', sans-serif; }
        
        /* Tema Visual do Deserto */
        .bg-desert-theme {
            background-color: #050301; 
            background-image: 
                linear-gradient(to bottom, rgba(5, 3, 1, 0.75), rgba(20, 10, 30, 0.88)),
                url('https://i.postimg.cc/bNVgfTBC/Gemini-Generated-Image-kmerfqkmerfqkmer-(1).png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        .card-hover-effect {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-hover-effect:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9);
            border-color: rgba(252, 211, 77, 0.6);
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1A1005; }
        ::-webkit-scrollbar-thumb { background: #96712E; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #FCD34D; }

        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dynamic-font {
            font-size: var(--app-font-size, 16px);
            transition: font-size 0.2s ease-in-out;
        }

        .pulse-soft {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .instruction-glow {
            text-shadow: 0 0 15px rgba(252, 211, 77, 0.5);
        }
    </style>
</head>
<body class="bg-desert-theme text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- BIBLIOTECA DE ÍCONES ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                ChevronDown: <path d="m6 9 6 6 6-6"/>,
                ChevronUp: <path d="m18 15-6-6-6 6"/>,
                ChevronRight: <path d="m9 18 6-6-6-6"/>,
                ArrowLeft: <path d="m12 19-7-7 7-7M5 12h14"/>,
                Cross: <path d="M11 2h2v17h-2z M5 8h14v2h-14z"/>,
                Footprints: <path d="M4 16c0-2 2-5 3-5s3 3 3 5-1 4-3 4-3-2-3-4z M14 8c0-2 2-5 3-5s3 3 3 5-1 4-3 4-3-2-3-4z"/>,
                Moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>,
                Flame: <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>,
                CheckCircle2: <React.Fragment><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></React.Fragment>,
                Fish: <path d="M2 12c5-5 13-5 18 0M2 12c5 5 13 5 18 0M20 12l4 4M20 12l4-4M18 12h-2"/>,
                Lock: <React.Fragment><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></React.Fragment>,
                X: <path d="M18 6 6 18M6 6l12 12"/>,
                Mail: <React.Fragment><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></React.Fragment>,
                Star: <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>,
                BookOpen: <React.Fragment><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></React.Fragment>,
                Heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>,
                Gift: <React.Fragment><rect width="18" height="14" x="3" y="8" rx="2"/><path d="M12 5v3m0 0v11M12 8H3m9 0h9M3 12h18"/></React.Fragment>,
                Plus: <path d="M12 5v14M5 12h14"/>,
                Minus: <path d="M5 12h14"/>,
                Type: <path d="M4 7V4h16v3M9 20h6M12 4v16"/>,
                Scroll: <path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4 M19 17V3a2 2 0 0 0-2-2H4"/>,
                Calendar: <React.Fragment><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></React.Fragment>,
                AlertCircle: <React.Fragment><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></React.Fragment>
            };

            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        // --- CONTROLO DE ACESSIBILIDADE ---
        const FontControls = ({ scale, setScale }) => (
            <div className="fixed bottom-6 right-6 z-[90] flex items-center bg-[#2D1B36] border border-[#FCD34D]/50 rounded-full p-2 shadow-2xl backdrop-blur-md">
                <button onClick={() => setScale(Math.max(0.8, scale - 0.1))} className="p-2 hover:bg-white/10 rounded-full transition-colors text-white"><Icon name="Minus" size={18} /></button>
                <div className="px-2 flex items-center gap-1 border-x border-white/10 mx-1">
                    <Icon name="Type" size={16} className="text-[#FCD34D]" />
                    <span className="text-[10px] font-bold text-white w-8 text-center">{Math.round(scale * 100)}%</span>
                </div>
                <button onClick={() => setScale(Math.min(1.5, scale + 0.1))} className="p-2 hover:bg-white/10 rounded-full transition-colors text-white"><Icon name="Plus" size={18} /></button>
            </div>
        );

        // --- COMPONENTE DE LOGIN ---
        const LoginView = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(email.trim() !== '' && password.trim() !== '') {
                    onLogin();
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 animate-fade-in relative z-10">
                    <div className="max-w-md w-full bg-black/80 backdrop-blur-2xl border border-[#FCD34D]/30 rounded-3xl p-8 md:p-10 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.9)] relative overflow-hidden">
                        
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#FCD34D] to-transparent opacity-70"></div>
                        
                        <div className="text-center mb-10">
                            <div className="mx-auto w-20 h-20 rounded-full border-2 border-[#FCD34D] bg-black/50 flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(252,211,77,0.3)] pulse-soft">
                                <Icon name="Cross" size={36} className="text-[#FCD34D]" />
                            </div>
                            <h1 className="font-vatican text-4xl md:text-5xl text-[#FCD34D] font-bold mb-3 uppercase tracking-tight drop-shadow-[0_0_15px_rgba(252,211,77,0.4)] leading-tight">
                                Itinerario<br/>Cuaresmal 2026
                            </h1>
                            <p className="font-sacred text-white/80 italic text-xl">El Camino del Desierto</p>
                        </div>

                        <div className="bg-[#FCD34D]/10 border border-[#FCD34D]/20 rounded-xl p-5 mb-8 text-center">
                            <Icon name="AlertCircle" size={20} className="text-[#FCD34D] mx-auto mb-3" />
                            <p className="text-sm font-reading text-gray-200 leading-relaxed">
                                Para ingresar, utiliza tu <strong>correo electrónico</strong> de registro.
                            </p>
                            <p className="text-sm font-reading text-gray-200 leading-relaxed mt-2">
                                Como contraseña, ingresa tu <strong>fecha de nacimiento</strong> (solo números).
                            </p>
                            <p className="text-xs text-[#FCD34D] mt-3 font-bold tracking-widest uppercase">Ejemplo: 05121990</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <Icon name="Mail" size={18} className="text-gray-400" />
                                </div>
                                <input 
                                    type="email" 
                                    required
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full pl-11 pr-4 py-4 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-[#FCD34D] focus:ring-1 focus:ring-[#FCD34D] transition-all font-reading"
                                    placeholder="Correo electrónico"
                                />
                            </div>
                            
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <Icon name="Lock" size={18} className="text-gray-400" />
                                </div>
                                <input 
                                    type="password" 
                                    required
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full pl-11 pr-4 py-4 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-[#FCD34D] focus:ring-1 focus:ring-[#FCD34D] transition-all font-reading"
                                    placeholder="Contraseña (DDMMAAAA)"
                                />
                            </div>
                            
                            <button 
                                type="submit"
                                className="w-full py-4 mt-6 bg-[#FCD34D] text-[#2D1B36] rounded-xl font-bold uppercase tracking-[0.2em] text-sm hover:bg-white hover:text-black transition-all shadow-[0_0_20px_rgba(252,211,77,0.3)] active:scale-[0.98]"
                            >
                                Iniciar el Camino
                            </button>
                        </form>

                        <div className="mt-8 pt-8 border-t border-white/10 text-center">
                            <p className="text-gray-300 font-reading text-sm mb-4">
                                Acceso exclusivo para suscriptores.
                            </p>
                            <a 
                                href="https://pay.hotmart.com/R104315521P?off=bsjlu74b&checkoutMode=10" 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="inline-flex items-center justify-center w-full gap-3 px-6 py-4 bg-white/5 border border-[#FCD34D]/40 rounded-xl text-[#FCD34D] hover:bg-[#FCD34D] hover:text-[#2D1B36] transition-all font-bold uppercase tracking-[0.15em] text-xs shadow-lg group"
                            >
                                <Icon name="Star" size={16} className="group-hover:animate-spin" />
                                Haz clic aquí y adquiere tu acceso
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MODAL DE BLOQUEIO ---
        const InfoModal = ({ isOpen, onClose, date }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-black/98 backdrop-blur-md animate-fade-in text-gray-800">
                    <div className="bg-[#FDFBF7] w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden border-2 border-[#96712E] relative p-8 text-center">
                        <div className="mx-auto w-16 h-16 rounded-full bg-amber-100 flex items-center justify-center mb-6 border border-amber-200 text-amber-600"><Icon name="Lock" size={32} /></div>
                        <h3 className="font-sacred text-2xl text-[#2D1B36] mb-2 font-bold uppercase tracking-tight">Aún no es el tiempo</h3>
                        <p className="font-reading text-gray-600 mb-6 leading-relaxed">Este paso del itinerario estará disponible el día <span className="font-bold text-[#4C1D95]">{date}</span>. Mantén la fidelidad diaria.</p>
                        <div className="bg-[#FAF5FF] rounded-xl p-4 mb-8 border border-purple-100 text-xs">
                             <div className="flex items-center justify-center gap-2 text-[#4C1D95] font-bold uppercase tracking-widest mb-2"><Icon name="Mail" size={14} /> Soporte</div>
                             <p className="text-gray-500 font-reading italic text-center leading-tight">Cualquier duda, póngase en contacto a través de:<br/><span className="text-[#96712E] font-bold block mt-1">suporte@app.tscotelaro.com.br</span></p>
                        </div>
                        <button onClick={onClose} className="w-full py-3 bg-[#2D1B36] text-[#FDFBF7] rounded-xl font-bold uppercase tracking-widest text-xs hover:bg-[#4C1D95] transition-all shadow-lg">Regresar</button>
                    </div>
                </div>
            );
        };

        // --- MODAL MENSAGEM DO PAPA ---
        const PapalMessageModal = ({ isOpen, onClose }) => {
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 z-[110] flex items-center justify-center p-2 md:p-4 bg-black/98 backdrop-blur-lg animate-fade-in text-gray-800">
              <div className="bg-[#FDFBF7] w-full max-w-4xl rounded-xl shadow-2xl overflow-hidden border-2 border-[#96712E] relative flex flex-col max-h-[95vh]">
                <div className="bg-[#F5F5F4] p-4 flex items-center justify-between border-b border-[#E7E5E4]">
                   <div className="flex items-center gap-3">
                     <div className="p-2 bg-[#FCD34D]/20 rounded-full border border-[#96712E]/30"><Icon name="Cross" size={20} className="text-[#96712E]" /></div>
                     <div><h3 className="font-sacred text-sm font-bold text-[#2D1B36] uppercase tracking-widest">Santa Sede</h3><p className="text-[10px] text-gray-500 uppercase font-bold text-xs">Mensaje Oficial</p></div>
                   </div>
                   <button onClick={onClose} className="p-2 rounded-full hover:bg-black/10 text-[#2D1B36] transition-colors"><Icon name="X" size={20} /></button>
                </div>
                <div className="p-6 md:p-12 overflow-y-auto font-reading text-gray-800 leading-relaxed text-justify space-y-6 text-base md:text-lg">
                  <div className="text-center mb-10">
                    <img src="https://i.postimg.cc/yNG5vKFL/Capturarcxasxsaxsa.gif" alt="Papa Francisco" className="w-full max-w-md mx-auto rounded-lg shadow-xl border border-[#96712E]/30 mb-8" />
                    <h2 className="font-vatican text-2xl md:text-4xl font-bold text-[#2D1B36] mb-2 uppercase">Mensaje del Santo Padre León XIV</h2>
                    <h3 className="font-sacred text-xl text-[#96712E] italic mb-6">PARA LA CUARESMA 2026</h3>
                    <div className="h-0.5 w-32 bg-[#96712E] mx-auto my-6"></div>
                  </div>
                  <div className="space-y-6">
                     <p className="font-bold">Queridos hermanos y hermanas:</p>
                     <p>La Cuaresma es el tiempo en el que la Iglesia, con solicitud maternal, nos invita a poner de nuevo el misterio de Dios en el centro de nuestra vida, para que nuestra fe recobre su impulso y el corazón no se disperse entre las inquietudes y distracciones cotidianas.</p>
                     <p>Todo camino de conversión comienza cuando nos dejamos alcanzar por la Palabra y la acogemos con docilidad de espíritu. Existe, por tanto, un vínculo entre el don de la Palabra de Dios, el espacio de hospitalidad que le ofrecemos y la transformación que ella realiza. Por eso, el itinerario cuaresmal se convierte en una ocasión propicia para escuchar la voz del Señor y renovar la decisión de seguir a Cristo, recorriendo con Él el camino que sube a Jerusalén, donde se cumple el misterio de su pasión, muerte y resurrección.</p>
                     
                     <div className="pt-4 border-t border-gray-100">
                        <h5 className="font-vatican font-bold text-xl text-[#4C1D95] mb-4 uppercase tracking-widest">Escuchar</h5>
                        <p className="mb-4">Este año me gustaría llamar la atención, en primer lugar, sobre la importancia de dar espacio a la Palabra a través de la <strong>escucha</strong>, ya que la disposición a escuchar es el primer signo con el que se manifiesta el deseo de entrar en relación con el otro.</p>
                        <p className="mb-4">Dios mismo, al revelarse a Moisés desde la zarza ardiente, muestra que la escucha es un rasgo distintivo de su ser: «Yo he visto la opresión de mi pueblo, que está en Egipto, y he oído los gritos de dolor» (Ex 3,7). La escucha del clamor de los oprimidos es el comienzo de una historia de liberación, en la que el Señor involucra también a Moisés, enviándolo a abrir un camino de salvación para sus hijos reducidos a la esclavitud.</p>
                        <p className="mb-4">Es un Dios que nos atrae, que hoy también nos conmueve con los pensamientos que hacen vibrar su corazón. Por eso, la escucha de la Palabra en la liturgia nos educa para una escucha más verdadera de la realidad.</p>
                        <p>Entre las muchas voces que atraviesan nuestra vida personal y social, las Sagradas Escrituras nos hacen capaces de reconocer la voz que clama desde el sufrimiento y la injusticia, para que no quede sin respuesta. Entrar en esta disposición interior de receptividad significa dejarnos instruir hoy por Dios para escuchar como Él, hasta reconocer que «la condición de los pobres representa un grito que, en la historia de la humanidad, interpela constantemente nuestra vida, nuestras sociedades, los sistemas políticos y económicos, y especialmente a la Iglesia».</p>
                     </div>

                     <div className="pt-4 border-t border-gray-100">
                        <h5 className="font-vatican font-bold text-xl text-[#4C1D95] mb-4 uppercase tracking-widest">Ayunar</h5>
                        <p className="mb-4">Si la Cuaresma es tiempo de escucha, el <strong>ayuno</strong> constituye una práctica concreta que dispone a la acogida de la Palabra de Dios. La abstinencia de alimento, en efecto, es un ejercicio ascético antiquísimo e insustituible en el camino de la conversión. Precisamente porque implica al cuerpo, hace más evidente aquello de lo que tenemos “hambre” y lo que consideramos esencial para nuestro sustento. Sirve, por tanto, para discernir y ordenar los “apetitos”, para mantener despierta el hambre y la sed de justicia, sustrayéndola de la resignación, educarla para que se convierta en oración y responsabilidad hacia el prójimo.</p>
                        <p className="italic bg-gray-50 p-6 border-l-4 border-[#96712E] my-6 rounded-r-lg text-gray-700 shadow-sm leading-relaxed">
                            San Agustín, con sutileza espiritual, deja entrever la tensión entre el tiempo presente y la realización futura que atraviesa este cuidado del corazón, cuando observa que: «es propio de los hombres mortales tener hambre y sed de la justicia, así como estar repletos de la justicia es propio de la otra vida. De este pan, de este alimento, están repletos los ángeles; en cambio, los hombres, mientras tienen hambre, se ensanchan; mientras se ensanchan, son dilatados; mientras son dilatados, se hacen capaces; y, hechos capaces, en su momento serán repletos». El ayuno, entendido en este sentido, nos permite no sólo disciplinar el deseo, purificarlo y hacerlo más libre, sino también expandirlo, de modo que se dirija a Dios y se oriente hacia el bien.
                        </p>
                        <p className="mb-4">Sin embargo, para que el ayuno conserve su verdad evangélica y evite la tentación de enorgullecer el corazón, debe vivirse siempre con fe y humildad. Exige permanecer arraigado en la comunión con el Señor, porque «no ayuna de verdad quien no sabe alimentarse de la Palabra de Dios». En cuanto signo visible de nuestro compromiso interior de alejarnos, con la ayuda de la gracia, del pecado y del mal, el ayuno debe incluir también otras formas de privación destinadas a hacernos adquirir un estilo de vida más sobrio, ya que «sólo la austeridad hace fuerte y auténtica la vida cristiana».</p>
                        <p>Por eso, me gustaría invitarles a una forma de abstinencia muy concreta y a menudo poco apreciada, es decir, la de abstenerse de utilizar palabras que afectan y lastiman a nuestro prójimo. Empecemos a desarmar el lenguaje, renunciando a las palabras hirientes, al juicio inmediato, a hablar mal de quienes están ausentes y no pueden defenderse, a las calumnias. Esforcémonos, en cambio, por aprender a medir las palabras y a cultivar la amabilidad: en la familia, entre amigos, en el lugar de trabajo, en las redes sociales, en los debates políticos, en los medios de comunicación y en las comunidades cristianas. Entonces, muchas palabras de odio darán paso a palabras de esperanza y paz.</p>
                     </div>

                     <div className="pt-4 border-t border-gray-100">
                        <h5 className="font-vatican font-bold text-xl text-[#4C1D95] mb-4 uppercase tracking-widest">Juntos</h5>
                        <p className="mb-4">Por último, la Cuaresma pone de relieve la dimensión comunitaria de la escucha de la Palabra y de la práctica del ayuno. También la Escritura subraya este aspecto de muchas maneras. Por ejemplo, cuando narra en el libro de Nehemías que el pueblo se reunió para escuchar la lectura pública del libro de la Ley y, practicando el ayuno, se dispuso a la confesión de fe y a la adoración, con el fin de renovar la alianza con Dios (cf. Ne 9,1-3).</p>
                        <p className="mb-4">Del mismo modo, nuestras parroquias, familias, grupos eclesiales y comunidades religiosas están llamados a realizar en Cuaresma un camino compartido, en el que la escucha de la Palabra de Dios, así como del clamor de los pobres y de la tierra, se convierta en forma de vida común, y el ayuno sostenga un arrepentimiento real. En este horizonte, la conversión no sólo concierne a la conciencia del individuo, sino también al estilo de las relaciones, a la calidad del diálogo, a la capacidad de dejarse interpelar por la realidad y de reconocer lo que realmente orienta el deseo, tanto en nuestras comunidades eclesiales como en la humanidad sedienta de justicia y reconciliación.</p>
                        <p className="mb-4">Queridos hermanos, pidamos la gracia de vivir una Cuaresma que haga más atento nuestro oído a Dios y a los más necesitados. Pidamos la fuerza de un ayuno que alcance también a la lengua, para que disminuyan las palabras que hieren y crezca el espacio para la voz de los demás. Y comprometámonos para que nuestras comunidades se conviertan en lugares donde el grito de los que sufren encuentre acogida y la escucha genere caminos de liberación, haciéndonos más dispuestos y diligentes para contribuir a edificar la civilización del amor.</p>
                        <p>Los bendigo de corazón a todos ustedes, y a su camino cuaresmal.</p>
                     </div>

                     <div className="pt-10 text-right text-sm italic text-gray-500">
                        <p>Vaticano, 5 de febrero de 2026, memoria de santa Águeda, virgen y mártir.</p>
                        <p className="font-vatican font-bold text-[#2D1B36] text-xl pt-2 not-italic uppercase">León XIV PP.</p>
                     </div>
                  </div>
                </div>
                 <div className="bg-[#F5F5F4] p-4 border-t border-[#E7E5E4] flex justify-center">
                    <button onClick={onClose} className="px-10 py-3 bg-[#2D1B36] text-[#FDFBF7] rounded-full text-xs font-bold uppercase tracking-widest hover:bg-[#4C1D95] transition-all shadow-lg">Cerrar Mensaje</button>
                 </div>
              </div>
            </div>
          );
        }

        // --- SEÇÃO DE INTRODUÇÃO ---
        const IntroSection = () => (
          <div className="container mx-auto px-4 pt-8 md:pt-12 pb-12 text-center max-w-4xl">
            <h1 className="font-vatican text-4xl md:text-6xl text-white mb-4 drop-shadow-lg uppercase tracking-tight">Itinerario Cuaresmal 2026</h1>
            <div className="h-1 w-32 bg-[#FCD34D] mx-auto mb-6"></div>
            <p className="font-sacred italic text-lg md:text-2xl text-[#E9D5FF] mb-8 drop-shadow-md">"He aquí el tiempo de conversión, he aquí el día de la salvación."</p>
            <div className="bg-black/60 backdrop-blur-xl rounded-2xl p-6 md:p-8 border border-white/10 shadow-2xl text-left md:text-center text-gray-100">
              <h3 className="font-bold uppercase tracking-widest text-[#FCD34D] text-xs mb-4 tracking-[0.2em]">Instrucciones del Camino</h3>
              <p className="font-reading leading-relaxed mb-6 text-sm md:text-lg">Bienvenido al desierto. Durante 40 días, subiremos a la montaña sagrada de la Pascua. Cada día trae un paso espiritual en la antigua tradición de la Iglesia:</p>
              <div className="grid grid-cols-2 md:grid-cols-5 gap-4 text-center">
                {[{ icon: "Star", title: "Statio", desc: "Preparar" },{ icon: "BookOpen", title: "Lectio", desc: "Leer" },{ icon: "Moon", title: "Meditatio", desc: "Meditar" },{ icon: "Heart", title: "Oratio", desc: "Rezar" },{ icon: "Footprints", title: "Actio", desc: "Actuar" }].map((item, idx) => (
                  <div key={idx} className="flex flex-col items-center gap-1 p-2 rounded-lg hover:bg-white/10 transition-colors">
                    <Icon name={item.icon} className="text-[#FCD34D]" size={18} />
                    <span className="font-sacred font-bold text-white text-xs">{item.title}</span>
                    <span className="text-[9px] text-gray-400 uppercase tracking-tighter">{item.desc}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );

        // --- COMPONENTE PORTA COM CONECTOR VISÍVEL ---
        const PathDay = ({ day, status, onClick, isLast, dateLabel, weekDay, isFriday, showPathToNext }) => {
          const isActive = status === 'active';
          return (
            <div className="relative flex items-center justify-center w-full group">
              {showPathToNext && (
                <div className="absolute left-1/2 w-full border-t-4 border-dotted border-[#FCD34D]/40 z-0 pointer-events-none transition-all duration-500 group-hover:border-[#FCD34D]/80" style={{ marginLeft: '1.5rem' }}></div>
              )}
              
              <button 
                onClick={onClick} 
                className={`relative z-10 flex flex-col items-center justify-center w-20 h-24 sm:w-24 sm:h-28 md:w-28 md:h-36 rounded-t-full rounded-b-3xl transition-all duration-300 ${isActive ? 'bg-[#2D1B36] -translate-y-2 shadow-[0_15px_40px_rgba(0,0,0,0.9)] border-2 border-[#FCD34D] ring-4 ring-[#FCD34D]/20' : 'bg-black/60 border border-white/10 opacity-70 hover:opacity-100 hover:scale-105 shadow-xl'}`}
              >
                {isActive && <div className="absolute -top-3 left-1/2 -translate-x-1/2"><Icon name="Flame" size={24} className="text-[#FCD34D] fill-[#FCD34D] animate-pulse" /></div>}
                {isFriday && <div className="absolute -top-2 -right-2 bg-blue-900/90 p-1.5 rounded-full shadow-md border border-blue-400 z-10"><Icon name="Fish" size={14} className="text-blue-200" /></div>}
                <span className={`font-sacred text-2xl sm:text-3xl md:text-4xl font-bold ${isActive ? 'text-[#FCD34D]' : 'text-gray-400'}`}>{day}</span>
                <div className={`flex flex-col items-center mt-1 ${isActive ? 'text-[#E9D5FF]' : 'text-gray-500'}`}><span className="text-[9px] sm:text-[10px] uppercase tracking-widest font-bold font-vatican">{dateLabel}</span><span className="text-[8px] sm:text-[9px] uppercase opacity-70 mt-0.5">{weekDay}</span></div>
              </button>
            </div>
          );
        };

        // --- APLICAÇÃO PRINCIPAL ---
        function App() {
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [showPapalMessage, setShowPapalMessage] = useState(false);
          const [infoModal, setInfoModal] = useState({ open: false, date: '' });
          const [fontScale, setFontScale] = useState(1.0);
          
          const getLentDate = (dayNumber) => {
            const startDate = new Date(2026, 1, 18); 
            const targetDate = new Date(startDate);
            targetDate.setDate(startDate.getDate() + (dayNumber - 1));
            return { 
                dayString: `${targetDate.getDate()} ${targetDate.toLocaleString('es-ES', { month: 'short' }).toUpperCase()}`, 
                weekday: targetDate.toLocaleString('es-ES', { weekday: 'short' }).toUpperCase(), 
                isFriday: targetDate.getDay() === 5 
            };
          };

          const handleDayClick = (day) => {
            const dateInfo = getLentDate(day);
            const links = { 
                1: 'https://01cuaresma2026.netlify.app/', 
                2: 'https://02cuaresma2026.netlify.app/', 
                3: 'https://03cuaresma2026.netlify.app/', 
                4: 'https://04cuaresma2026.netlify.app/',
                5: 'https://05cuaresma2026.netlify.app/',
                6: 'https://06cuaresma2026.netlify.app/'
            };
            if(links[day]) { window.open(links[day], '_blank'); } 
            else { setInfoModal({ open: true, date: `${dateInfo.dayString} (2026)` }); }
          };

          if (!isAuthenticated) {
            return (
               <div className="dynamic-font" style={{ "--app-font-size": `${16 * fontScale}px` }}>
                   <FontControls scale={fontScale} setScale={setFontScale} />
                   <LoginView onLogin={() => setIsAuthenticated(true)} />
               </div>
            );
          }

          return (
            <div className="min-h-screen dynamic-font pb-24" style={{ "--app-font-size": `${16 * fontScale}px` }}>
              <PapalMessageModal isOpen={showPapalMessage} onClose={() => setShowPapalMessage(false)} />
              <InfoModal isOpen={infoModal.open} onClose={() => setInfoModal({ open: false, date: '' })} date={infoModal.date} />
              <FontControls scale={fontScale} setScale={setFontScale} />
              
              <div className="container mx-auto px-4 animate-fade-in pb-20">
                 <IntroSection />
                 
                 {/* CARTÃO DO PAPA */}
                 <div className="flex justify-center mb-16 px-2">
                  <div onClick={() => setShowPapalMessage(true)} className="card-hover-effect group relative max-w-2xl w-full cursor-pointer overflow-hidden rounded-3xl border border-[#FCD34D]/20 bg-[#1A1005]/80 backdrop-blur-xl p-4 md:p-6 flex flex-col md:flex-row items-center gap-6 shadow-2xl">
                     <div className="absolute top-0 right-0 w-32 h-32 bg-[#FCD34D]/5 rounded-full blur-2xl pointer-events-none"></div>
                     <div className="relative w-24 h-24 md:w-32 md:h-32 shrink-0 z-10">
                        <div className="absolute inset-0 rounded-full border-2 border-[#FCD34D] rotate-45 group-hover:rotate-90 transition-transform duration-700"></div>
                        <img src="https://i.postimg.cc/MpmqPnH2/cq5dam-thumbnail-cropped-750-422.jpg" alt="Papa" className="w-full h-full object-cover rounded-full p-1" />
                        <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-[#FCD34D] text-[#2D1B36] rounded-full p-1.5 shadow-lg pulse-soft"><Icon name="ChevronDown" size={14} className="stroke-[3]" /></div>
                     </div>
                     <div className="text-center md:text-left flex-1 space-y-2 text-white z-10">
                        <div className="flex items-center justify-center md:justify-start gap-2"><span className="bg-[#FCD34D]/20 text-[#FCD34D] text-[10px] font-bold uppercase tracking-[0.2em] px-3 py-1 rounded-full border border-[#FCD34D]/30">Vaticano</span><span className="text-gray-400 text-[10px] uppercase tracking-widest font-bold font-vatican">Cuaresma 2026</span></div>
                        <h3 className="font-vatican font-bold text-xl md:text-2xl group-hover:text-[#FCD34D] transition-colors leading-tight">Mensaje del Santo Padre León XIV</h3>
                        <p className="text-gray-300 text-sm italic font-sacred line-clamp-2">"Escuchar y ayunar: tiempo de conversión. Queridos hermanos y hermanas..."</p>
                        <div className="pt-2 flex items-center justify-center md:justify-start gap-2 text-[#FCD34D] text-xs font-bold uppercase tracking-widest opacity-70 group-hover:opacity-100 transition-opacity"><Icon name="Scroll" size={14} /><span>Toca para leer el mensaje completo</span><Icon name="ChevronRight" size={14} /></div>
                     </div>
                  </div>
                 </div>

                 {/* INSTRUÇÃO E FRASE */}
                 <div className="max-w-4xl mx-auto text-center mb-12 px-4 space-y-8">
                    <p className="font-sacred text-2xl md:text-4xl text-white italic leading-relaxed drop-shadow-2xl opacity-95 text-gray-100">"Aquí comienza tu ascenso al monte sagrado. En este desierto de gracia, <span className="text-[#FCD34D] not-italic font-bold underline decoration-[#96712E]/50 underline-offset-8">cada día es un umbral</span>: una nueva puerta de conversión se abre ante tu corazón."</p>
                    <div className="inline-flex items-center gap-3 bg-[#FCD34D]/10 border border-[#FCD34D]/40 rounded-full px-8 py-4 animate-fade-in ring-1 ring-[#FCD34D]/20 shadow-[0_0_20px_rgba(252,211,77,0.1)]">
                        <Icon name="Calendar" size={20} className="text-[#FCD34D] animate-pulse" />
                        <span className="font-vatican text-sm md:text-base text-[#FCD34D] font-bold uppercase tracking-widest instruction-glow">Abre únicamente la puerta correspondiente al día de hoy</span>
                    </div>
                 </div>

                 {/* --- ÁREA DAS PORTAS COM DESTAQUE MAIS ESCURO --- */}
                 <div className="relative w-full max-w-6xl mx-auto bg-black/70 backdrop-blur-xl border border-[#FCD34D]/20 rounded-[2.5rem] p-6 sm:p-8 md:p-12 mb-32 shadow-[0_30px_60px_-15px_rgba(0,0,0,1)]">
                    
                    <div className="absolute top-0 left-1/2 -translate-x-1/2 w-2/3 h-px bg-gradient-to-r from-transparent via-[#FCD34D]/50 to-transparent"></div>
                    <div className="absolute top-0 left-1/2 -translate-x-1/2 w-1/3 h-32 bg-[#FCD34D]/5 blur-[80px] pointer-events-none rounded-full"></div>

                    {/* GRELHA DE PORTAS */}
                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-8 gap-x-3 gap-y-10 sm:gap-x-4 sm:gap-y-12 place-items-center relative z-10">
                    {Array.from({ length: 40 }, (_, i) => i + 1).map((day, index) => {
                        const { dayString, weekday, isFriday } = getLentDate(day);
                        const status = (day <= 6) ? 'active' : 'locked';
                        
                        const nextIsActive = (day + 1) <= 6;
                        const currentGridCols = window.innerWidth < 640 ? 3 : window.innerWidth < 768 ? 4 : window.innerWidth < 1024 ? 5 : 8;
                        const isNotEndOfRow = (index + 1) % currentGridCols !== 0;
                        const showPath = nextIsActive && isNotEndOfRow;

                        return (
                            <PathDay key={day} day={day} dateLabel={dayString} weekDay={weekday} isFriday={isFriday} status={status} isLast={index === 39} showPathToNext={showPath} onClick={() => handleDayClick(day)} />
                        );
                    })}
                    </div>
                 </div>
                 {/* --- FIM DA ÁREA DAS PORTAS --- */}

                 {/* FRASE DE ENCERRAMENTO */}
                 <div className="text-center max-w-2xl mx-auto px-4 mb-32 relative text-white">
                      <div className="flex justify-center mb-8 opacity-40 text-[#FCD34D]"><Icon name="Cross" size={60} /></div>
                      <blockquote className="relative z-10 font-sacred text-2xl md:text-3xl italic leading-relaxed text-gray-100">"Todo camino de conversión comienza cuando nos dejamos alcanzar por la Palabra y la acogemos con docilidad de espíritu."</blockquote>
                      <div className="flex items-center justify-center gap-3 mt-8 text-[#FCD34D]">
                        <div className="h-px w-8 bg-[#FCD34D]/50"></div>
                        <p className="text-xs font-bold uppercase tracking-widest font-vatican">Papa León XIV • Cuaresma 2026</p>
                        <div className="h-px w-8 bg-[#FCD34D]/50"></div>
                      </div>
                 </div>

                 {/* SEÇÃO REGALO */}
                 <div className="mt-32 bg-[#1A1005]/80 backdrop-blur-xl border border-[#FCD34D]/30 rounded-3xl p-8 md:p-12 text-center max-w-2xl mx-auto shadow-2xl relative overflow-hidden card-hover-effect">
                    <div className="absolute top-0 right-0 p-4 opacity-5 text-[#FCD34D]"><Icon name="Gift" size={150} /></div>
                    <div className="relative z-10">
                        <div className="mx-auto w-20 h-20 bg-[#FCD34D] rounded-full flex items-center justify-center mb-6 shadow-xl"><Icon name="Gift" className="text-[#2D1B36]" size={40} /></div>
                        <h3 className="font-sacred text-3xl text-white mb-4 uppercase tracking-wide font-bold">¿Conoces a alguien que necesita a Dios?</h3>
                        <p className="text-gray-300 mb-10 font-reading text-lg leading-relaxed">La fe crece cuando se comparte. Regala este <strong>Itinerario Cuaresmal</strong> a un amigo o familiar. Hemos preparado una oferta especial para evangelizar.</p>
                        <a href="https://pay.hotmart.com/R104315521P?off=bsjlu74b&checkoutMode=10" target="_blank" className="inline-flex items-center gap-3 px-10 py-5 bg-[#FCD34D] text-[#2D1B36] rounded-full font-bold uppercase tracking-widest text-sm transition-all shadow-[0_0_20px_rgba(252,211,77,0.4)] hover:scale-105 hover:bg-white active:scale-95">Regalar con Descuento Especial</a>
                    </div>
                 </div>

                 <footer className="mt-40 py-12 text-center text-gray-500 border-t border-white/10 font-sacred">
                    <p className="tracking-widest text-xs uppercase font-bold">Ad Majorem Dei Gloriam</p>
                    <div className="flex items-center justify-center gap-2 text-[10px] mt-3 font-reading opacity-50 uppercase tracking-widest font-bold"><Icon name="Mail" size={12} /> Soporte: suporte@app.tscotelaro.com.br</div>
                 </footer>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
